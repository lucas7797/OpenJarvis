<style>
*{box-sizing:border-box}
:root{--bg:#eef1f4;--panel:#fff;--ink:#17202b;--mut:#5b6876;--line:#d6dde4;--acc:#0b5cad;--accs:#e7f0fa;--nav:#13263b;--navi:#c3d0dd;--navh:#1d3550;--navon:#2b5d93}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1318;--panel:#18202a;--ink:#e4e9ee;--mut:#98a6b4;--line:#2c3744;--acc:#62a8f2;--accs:#1a2b3e;--nav:#0a1016;--navh:#15212d;--navon:#22466f}}
:root[data-theme="dark"]{--bg:#0e1318;--panel:#18202a;--ink:#e4e9ee;--mut:#98a6b4;--line:#2c3744;--acc:#62a8f2;--accs:#1a2b3e;--nav:#0a1016;--navh:#15212d;--navon:#22466f}
html,body{margin:0}
body{font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;height:calc(52px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));background:var(--nav);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.06)}
.ib{background:transparent;border:0;color:#fff;font-size:20px;width:36px;height:36px;border-radius:6px}
.ib:hover{background:var(--navh)}
.brand{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;letter-spacing:.2px}
.brand small{font-weight:400;opacity:.7;margin-left:6px}
.acts{display:flex;gap:6px}
.acts button{background:var(--navh);color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:6px 10px;font-size:13px;white-space:nowrap}
.acts button:hover{background:var(--navon)}
.acts button.pri{background:#1f7ae0;border-color:#1f7ae0}
#bInstall{background:#1f9d55;border-color:#1f9d55}
@media (display-mode:standalone){#bPrint{display:none}}
.native #bPrint,.native #bInstall{display:none!important}
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none}
.layout{display:flex;min-height:calc(100vh - 52px)}
nav{width:258px;flex:none;background:var(--nav);color:var(--navi);overflow:auto;position:sticky;top:52px;height:calc(100vh - 52px);padding-bottom:30px}
nav .nsearch{padding:10px}
nav .nsearch input{width:100%;padding:7px 9px;border-radius:6px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff}
.ngh{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.6;padding:12px 14px 4px}
nav a{display:block;padding:6px 14px 6px 18px;color:var(--navi);text-decoration:none;font-size:13.5px;border-left:3px solid transparent}
nav a:hover{background:var(--navh);color:#fff}
nav a.on{background:var(--navon);color:#fff;border-left-color:#7fb8ff}
main{flex:1;min-width:0;padding:16px 16px 60px}
#scrim{display:none}
@media (max-width:900px){
 nav{position:fixed;left:0;top:52px;bottom:0;height:auto;z-index:35;transform:translateX(-105%);transition:transform .2s}
 body.navopen nav{transform:none}
 body.navopen #scrim{display:block;position:fixed;inset:52px 0 0 0;background:rgba(0,0,0,.4);z-index:30}
 main{padding:10px 8px 60px}
 .brand small{display:none}
}
@media (max-width:480px){.acts button{padding:6px 7px;font-size:12px}#bPrint{display:none}}
/* ---------- report sheet (paper, always light) ---------- */
.sheet{background:#fff;color:#111;max-width:1040px;margin:0 auto;padding:22px 26px;border:1px solid #c9d1d9;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.sheet input,.sheet select,.sheet textarea{font:inherit;color:#111;background:#f6f9fc;border:1px solid #d3dbe3;border-radius:3px;padding:4px 6px;width:100%;min-width:0}
.sheet input:focus,.sheet select:focus,.sheet textarea:focus{outline:2px solid #6aa7ea;outline-offset:-1px;background:#fff}
.sheet textarea{min-height:54px;resize:vertical}
.rh{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;border-bottom:2px solid #1c2b3a;padding-bottom:10px}
.rh .logo img{max-height:64px;max-width:120px;display:block}
.rh .rht{text-align:center}
.rh .lab input,.rh .lab .pv{font-weight:700;font-size:15px;text-align:center;text-transform:uppercase;letter-spacing:.04em;background:transparent;border-color:transparent}
.rh h1{margin:4px 0 2px;font-size:17px}
.rh h1 textarea,.rh h1 .pv{font-size:17px;font-weight:700;text-align:center;background:transparent;border-color:transparent;resize:none;min-height:0;overflow:hidden;line-height:1.3;display:block}
.rh .std input,.rh .std .pv{font-size:12px;text-align:center;color:#444;background:transparent;border-color:transparent}
.rh .rno{display:grid;grid-template-columns:auto 130px;gap:4px 6px;font-size:12px;align-items:center}
.rh .rno b{font-weight:600}
.pgrid{display:grid;grid-template-columns:1fr 1fr;border:1px solid #8c98a4;border-bottom:0;margin:12px 0}
.pf{display:flex;border-bottom:1px solid #8c98a4;min-width:0}
.pf:nth-child(odd){border-right:1px solid #8c98a4}
.pf>span{flex:0 0 40%;background:#f0f3f6;padding:5px 7px;font-weight:600;font-size:12px;border-right:1px solid #c5cdd5}
.pf>input,.pf>.pv{border:0;background:transparent;border-radius:0;padding:5px 7px;font-size:12.5px}
.pf.wide{grid-column:1/-1;border-right:0}
.pf.wide>span{flex-basis:20%}
.sheet h3{font-size:13.5px;margin:16px 0 6px;padding:4px 8px;background:#1c2b3a;color:#fff;border-radius:2px}
.frow{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 12px;margin:8px 0}
.fld{display:flex;flex-direction:column;gap:2px;min-width:0}
.fld>span{font-size:11.5px;color:#46525e;font-weight:600}
.fld.out b{display:block;padding:4px 7px;background:#edf6ef;border:1px solid #b9dcc4;border-radius:3px;min-height:28px;font-size:14px}
.fld.out small{color:#555}
.frow.res .fld.out b{font-size:16px}
.tw{overflow-x:auto;margin:6px 0;-webkit-overflow-scrolling:touch}
table.tb{border-collapse:collapse;width:100%;font-size:12.5px}
.tb th,.tb td{border:1px solid #8f9aa6;padding:3px 4px;text-align:center;vertical-align:middle}
.tb th{background:#e8edf2;font-weight:600;font-size:11.5px;line-height:1.25}
.tb td input,.tb td select{text-align:center;padding:3px 4px;min-width:56px;background:#f8fbfd}
.tb td.o{background:#f4f8f4;font-variant-numeric:tabular-nums;min-width:60px}
.tb td.l{text-align:left}
.tb td.l input{text-align:left}
.tb .x{border:0;background:transparent;color:#b3261e;font-size:16px;line-height:1;padding:2px 6px}
.tb tfoot td{font-weight:700;background:#eef2f6}
.pass{color:#0d6b33!important;font-weight:700}
.fail{color:#b3261e!important;font-weight:700}
.btn{background:#fff;border:1px solid #b9c4cf;color:#17324d;border-radius:5px;padding:5px 10px;font-size:12.5px}
.btn:hover{background:#eef4fa}
.btn.pri{background:#0b5cad;color:#fff;border-color:#0b5cad}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.addr{margin:2px 0 6px;background:transparent;border:1px dashed #9fb0c1;color:#0b5cad;border-radius:4px;padding:3px 10px;font-size:12px}
.result{margin:14px 0 6px;padding:9px 12px;border-radius:4px;font-weight:700;font-size:14px;border:1px solid}
.result.ok{background:#e3f4e8;color:#0d5c2e;border-color:#9bd3ad}
.result.bad{background:#fde8e6;color:#9a1d15;border-color:#efaaa3}
.result.na{background:#f4f6f8;color:#66717d;border:1px dashed #b8c2cc;font-weight:500}
.rem{margin-top:10px}
.rem b{font-size:12px}
.note{font-size:11.5px;color:#5a6672;margin:4px 0}
canvas.ch{width:100%;height:300px;display:block;margin-top:10px;border:1px solid #c5cdd5;background:#fff}
img.chimg{width:100%;display:block;margin-top:10px;border:1px solid #c5cdd5}
.sigs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;margin-top:26px}
.sg{text-align:center;font-size:12px}
.sgimg{height:66px;border-bottom:1px solid #333;display:flex;align-items:flex-end;justify-content:center;cursor:pointer;position:relative}
.sgimg img{max-height:62px;max-width:100%}
.sgimg .hint{color:#8a96a3;font-size:11px;padding-bottom:4px}
.sgl{font-weight:700;margin-top:4px}
.sgn{color:#333}
.sgd{color:#666;font-size:11px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{border:1px solid #b9c4cf;border-radius:4px;padding:8px 10px}
.card h4{margin:0 0 6px;font-size:13px;color:#1c2b3a}
.card .frow{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.st{font-weight:700}
@media (max-width:640px){
 .sheet{padding:12px 10px}
 .rh{grid-template-columns:1fr}
 .rh .logo{display:none}
 .rh .rno{grid-template-columns:auto 1fr}
 .pgrid{grid-template-columns:1fr}
 .pf:nth-child(odd){border-right:0}
 .pf.wide>span{flex-basis:40%}
}
/* pdf render */
.pdfhost{position:fixed;left:-12000px;top:0;width:820px;background:#fff;z-index:-1}
.sheet.pdf{width:820px;max-width:none;border:0;box-shadow:none;margin:0;padding:18px 22px;border-radius:0}
.pdf .pv{display:block;min-height:1.3em;padding:3px 5px;white-space:pre-wrap;word-break:break-word}
.pdf .tb td .pv{display:inline-block;padding:2px 3px;text-align:center;white-space:nowrap;word-break:normal}
.pdf .tb td.l .pv{display:block;text-align:left;white-space:pre-wrap}
.pdf .tb th{font-size:10.5px}
.pdf .fld .pv{border-bottom:1px solid #b7c0c9}
.pdf .rh .rno .pv{border-bottom:1px solid #b7c0c9}
.pdf .result.na,.pdf .np,.pdf .addr,.pdf .btns{display:none!important}
.pdf .sgimg .hint{display:none}
.pdf .rem .pv{border:1px solid #c5cdd5;min-height:40px}
/* tools (non-report) */
.tool{max-width:1040px;margin:0 auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:18px}
.tool h2{margin:0 0 4px;font-size:19px}
.tool p.sub{margin:0 0 14px;color:var(--mut)}
.tool input,.tool select,.tool textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:6px 8px;width:100%}
.tool .btn{background:var(--panel);color:var(--ink);border-color:var(--line)}
.tool .btn:hover{background:var(--accs)}
.tool .btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
.tool .btn.dan{color:#c0392b}
.tool .frow .fld>span{color:var(--mut)}
.tool table{border-collapse:collapse;width:100%;font-size:13px}
.tool th,.tool td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:middle}
.tool th{color:var(--mut);font-weight:600;font-size:12px}
.slot{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.slot .pad{grid-column:1/-1}
.padc{width:100%;height:170px;background:#fff;border:1px dashed #9aa8b6;border-radius:6px;touch-action:none;display:block}
@media (max-width:640px){.slot{grid-template-columns:1fr}}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:14px}
.pg{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg)}
.pg img{width:100%;height:220px;object-fit:contain;background:#fff;border-radius:4px;display:block}
.pg .row{display:flex;gap:4px;margin-top:6px;align-items:center}
.pg .row select{flex:1;padding:4px}
.pg .row button{padding:4px 7px}
#camwrap{margin-top:12px;background:#000;border-radius:8px;padding:8px;text-align:center}
#camwrap video{max-width:100%;max-height:60vh;border-radius:6px}
.chk{display:flex;gap:8px;align-items:center;margin:10px 0}
.chk input{width:auto}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1c2b3a;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:100;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:90;padding:14px}
#modal.on{display:flex}
.mbox{background:var(--panel);color:var(--ink);border-radius:10px;padding:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.mbox h3{margin:0 0 10px}
.mbox .btns .btn{background:var(--panel);color:var(--ink);border-color:var(--line);padding:8px 12px}
.mbox .btns .btn.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.55);display:none;align-items:center;justify-content:center;z-index:95;font-weight:700;color:#13263b}
#busy.on{display:flex}
@media print{
 .top,nav,#toast,#modal,.np,.addr,.btns,.result.na{display:none!important}
 body{background:#fff}
 main{padding:0}
 .layout{display:block}
 .sheet{border:0;box-shadow:none;max-width:none;padding:0}
 .sheet input,.sheet select,.sheet textarea{border:0;background:transparent;-webkit-appearance:none;appearance:none}
 canvas.ch{break-inside:avoid}
 tr,.card,.sigs{break-inside:avoid}
}
</style>

<body>
<header class="top">
 <button class="ib" id="menuBtn" aria-label="Menu">☰</button>
 <div class="brand">Civil Site Lab <small>On-site Test Report Generator</small></div>
 <div class="acts">
  <button id="bInstall" hidden title="Install as an app on this device">Install</button>
  <button id="bNew" title="Reset this test to blank">New</button>
  <button id="bSave" title="Save to records (Ctrl+S)">Save</button>
  <button id="bPdf" class="pri" title="Download PDF">PDF</button>
  <button id="bShare" title="Share PDF">Share</button>
  <button id="bPrint" title="Print">Print</button>
 </div>
</header>
<div class="layout">
 <nav id="nav"></nav>
 <div id="scrim"></div>
 <main id="main"></main>
</div>
<div id="modal"><div class="mbox" id="mbox"></div></div>
<div id="toast"></div>
<div id="busy">Preparing PDF…</div>
<script>
'use strict';
/* =================== utilities =================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>{if(v===null||v===undefined||v==='')return NaN;const n=parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:NaN};
const ok=n=>typeof n==='number'&&isFinite(n);
const f=(v,d=2)=>ok(v)?(+v).toFixed(d):'';
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=s=>{if(!s)return'';const p=s.split('-');return p.length===3?`${p[2]}-${p[1]}-${p[0]}`:s};
const avg=a=>{const b=a.filter(ok);return b.length?b.reduce((x,y)=>x+y,0)/b.length:NaN};
const deep=o=>JSON.parse(JSON.stringify(o));
const rep=(n,fn)=>Array.from({length:n},fn);
function gp(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o)}
function sp(o,p,v){const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++){if(a[ks[i]]==null)a[ks[i]]=/^\d+$/.test(ks[i+1])?[]:{};a=a[ks[i]]}a[ks[ks.length-1]]=v}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2600)}
function modal(html){$('#mbox').innerHTML=html;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on');$('#mbox').innerHTML=''}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
/* native Android app (Capacitor): save/share files through the OS */
const CAP=window.Capacitor,NATIVE=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());
const blobB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(b)});
async function nativeWrite(blob,name,dir){const FS=CAP.Plugins.Filesystem;const data=await blobB64(blob);const r=await FS.writeFile({path:name,data,directory:dir,recursive:true});return r.uri}
async function nativeShare(blob,name,text){const uri=await nativeWrite(blob,name,'CACHE');await CAP.Plugins.Share.share({title:name,text,files:[uri],dialogTitle:'Share report'})}
if(NATIVE)document.documentElement.classList.add('native');
function download(blob,name){if(NATIVE){nativeWrite(blob,'CivilSiteLab/'+name,'DOCUMENTS').then(()=>toast('Saved to Documents/CivilSiteLab/'+name)).catch(()=>nativeShare(blob,name,'').catch(e=>toast('Could not save: '+(e.message||e))));return}const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function interp(pts,x){if(!pts.length)return NaN;if(x<=pts[0][0])return pts[0][1];for(let i=1;i<pts.length;i++){if(x<=pts[i][0]){const[a,b]=pts[i-1],[c,d]=pts[i];return b+(d-b)*(x-a)/(c-a)}}return pts[pts.length-1][1]}
function solve3(M){for(let i=0;i<3;i++){let p=i;for(let r=i+1;r<3;r++)if(Math.abs(M[r][i])>Math.abs(M[p][i]))p=r;[M[i],M[p]]=[M[p],M[i]];if(Math.abs(M[i][i])<1e-12)return null;for(let r=0;r<3;r++){if(r===i)continue;const k=M[r][i]/M[i][i];for(let c=i;c<4;c++)M[r][c]-=k*M[i][c]}}return[M[0][3]/M[0][0],M[1][3]/M[1][1],M[2][3]/M[2][2]]}
function quadFit(pts){let n=pts.length,a=0,b=0,c=0,d=0,e=0,g=0,h=0;for(const[x,y]of pts){const x2=x*x;a+=x;b+=x2;c+=x2*x;d+=x2*x2;e+=y;g+=x*y;h+=x2*y}return solve3([[d,c,b,h],[c,b,a,g],[b,a,n,e]])}
function linFit(pts){const n=pts.length;let sx=0,sy=0,sxx=0,sxy=0;for(const[x,y]of pts){sx+=x;sy+=y;sxx+=x*x;sxy+=x*y}const den=n*sxx-sx*sx;if(!den)return null;const m=(n*sxy-sx*sy)/den;return[m,(sy-m*sx)/n]}
function peak(pts){if(pts.length<3)return null;const s=[...pts].sort((a,b)=>a[0]-b[0]);let i=0;s.forEach((p,j)=>{if(p[1]>s[i][1])i=j});if(i>0&&i<s.length-1){const q=quadFit([s[i-1],s[i],s[i+1]]);if(q&&q[0]<0){const x=-q[1]/(2*q[0]);if(x>=s[i-1][0]&&x<=s[i+1][0])return[x,q[0]*x*x+q[1]*x+q[2]]}}return[s[i][0],s[i][1]]}

/* =================== state =================== */
const LS='civlab_v1';
function defSig(){return[{label:'Tested by',name:'',des:'Lab Technician',on:true,img:''},{label:'Checked by',name:'',des:'Quality Engineer',on:true,img:''},{label:"Contractor's Representative",name:'',des:'',on:true,img:''},{label:'Engineer / Consultant',name:'',des:'',on:true,img:''}]}
function defState(){return{project:{name:'',client:'',consultant:'',contractor:'',agreement:''},settings:{lab:'Site Quality Control Laboratory',logo:'',theme:'auto',annex:false},sig:defSig(),tests:{},records:[],cur:''}}
let S;try{S=JSON.parse(localStorage.getItem(LS))}catch(e){}
if(!S||!S.tests)S=defState();
S.records??=[];S.sig??=defSig();S.settings??=defState().settings;S.project??=defState().project;
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(saveNow,250)}
function saveNow(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast('Device storage is full — export a backup from Records and delete old records')}}

 const dpr=Math.max(2,window.devicePixelRatio||1),W=cv.clientWidth||760,H=c.h||300;

 const lx=v=>Math.log10(v);
 const tx=c.xlog?v=>L+(lx(v)-lx(c.x0))/(lx(c.x1)-lx(c.x0))*pw:v=>L+(v-c.x0)/(c.x1-c.x0)*pw;
 const ty=v=>Tp+ph-(v-c.y0)/(c.y1-c.y0)*ph;

 yt.forEach(v=>{const y=ty(v);g.beginPath();g.moveTo(L,y);g.lineTo(L+pw,y);g.stroke();g.fillText(c.yf?c.yf(v):+v.toFixed(3),L-5,y)});
 const xt=c.xt||rep(7,(_,i)=>c.x0+(c.x1-c.x0)*i/6);
 g.textAlign='center';g.textBaseline='top';
 let lastX=-99;xt.forEach(v=>{const x=tx(v);if(x<L-1||x>L+pw+1)return;g.beginPath();g.moveTo(x,Tp);g.lineTo(x,Tp+ph);g.stroke();if(x-lastX>22){g.fillText(c.xf?c.xf(v):+(+v).toFixed(3),x,Tp+ph+4);lastX=x}});
 g.strokeStyle='#333';g.strokeRect(L,Tp,pw,ph);
 g.fillStyle='#222';g.font='600 11.5px system-ui,Arial';g.fillText(c.xl||'',L+pw/2,H-15);
 g.save();g.translate(12,Tp+ph/2);g.rotate(-Math.PI/2);g.textBaseline='middle';g.fillText(c.yl||'',0,0);g.restore();
 if(c.title){g.textAlign='left';g.textBaseline='top';g.fillText(c.title,L,6)}
 g.save();g.beginPath();g.rect(L,Tp,pw,ph);g.clip();
 (c.series||[]).forEach(s=>{const P=s.pts.filter(p=>ok(p[0])&&ok(p[1])&&(!c.xlog||p[0]>0)).map(p=>[tx(p[0]),ty(p[1])]);if(!P.length)return;
  g.strokeStyle=s.col;g.fillStyle=s.col;g.lineWidth=s.w||2;g.setLineDash(s.dash||[]);
  if(s.line!==false&&P.length>1){g.beginPath();g.moveTo(P[0][0],P[0][1]);if(s.smooth&&P.length>2){for(let i=0;i<P.length-1;i++){const p0=P[i-1]||P[i],p1=P[i],p2=P[i+1],p3=P[i+2]||p2;g.bezierCurveTo(p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,p2[0],p2[1])}}else P.slice(1).forEach(p=>g.lineTo(p[0],p[1]));g.stroke()}
  g.setLineDash([]);if(s.dot)P.forEach(p=>{g.beginPath();g.arc(p[0],p[1],s.dot,0,7);g.fill()})});
 (c.marks||[]).forEach(m=>{if(!ok(m.x)||!ok(m.y))return;const x=tx(m.x),y=ty(m.y);g.strokeStyle='#b3261e';g.setLineDash([3,3]);g.lineWidth=1;g.beginPath();g.moveTo(x,Tp+ph);g.lineTo(x,y);g.lineTo(L,y);g.stroke();g.setLineDash([]);g.fillStyle='#b3261e';g.beginPath();g.arc(x,y,4.5,0,7);g.fill();g.font='600 11px system-ui,Arial';g.textAlign=x>L+pw*0.7?'right':'left';g.textBaseline='bottom';g.fillText(m.t,x+(x>L+pw*0.7?-6:6),y-6)});
 g.restore();
 let lxp=L+pw-6;g.font='11px system-ui,Arial';g.textBaseline='middle';g.textAlign='right';
 [...(c.series||[])].reverse().forEach(s=>{if(!s.label)return;g.fillStyle='#222';g.fillText(s.label,lxp,Tp-12);const w=g.measureText(s.label).width;g.strokeStyle=s.col;g.lineWidth=2;g.setLineDash(s.dash||[]);g.beginPath();g.moveTo(lxp-w-24,Tp-12);g.lineTo(lxp-w-6,Tp-12);g.stroke();g.setLineDash([]);lxp-=w+36});
}

/* =================== SIEVE ANALYSIS =================== */
function sieveMod(id,title,rt,spec){reg({id,g:'Sieve Analysis',title,rt,std:'IS 2386 (Part 1) : 1963 / IS 383 : 2016 / MoRTH 5th Rev.',
 init:()=>({spec,total:'',washed:'',rows:[...specRows(spec),{s:'Pan',w:'',lo:'',hi:''}]}),
 blank:()=>({s:'',w:'',lo:'',hi:''}),
 view:d=>`<div class="frow">${F('Specification / Grading',SEL('spec',d.spec,specOpts()))}${F('Total dry wt. of sample W (g)',N('total',d.total,{ph:'blank = sum of retained'}))}${F('Dry wt. after washing on 75µ (g)',N('washed',d.washed))}${O('Sum of wt. retained','sum','g')}${O('Loss / (gain) in sieving','loss','%')}${O('Fineness modulus','fm')}</div>`
  +T('rows',[{k:'s',h:'IS Sieve<br>(mm)',t:'txt'},{k:'w',h:'Wt. retained<br>(g)'},{k:'cw',h:'Cum. wt.<br>retained (g)',t:'o'},{k:'pr',h:'% Wt.<br>retained',t:'o'},{k:'cr',h:'Cum. %<br>retained',t:'o'},{k:'pp',h:'% Passing',t:'o'},{k:'lo',h:'Spec. lower<br>limit (%)'},{k:'hi',h:'Spec. upper<br>limit (%)'},{k:'st',h:'Remarks',t:'o'}],d.rows,{sn:'S.No'})
  +`<p class="note np">Limits are pre-filled from the selected specification and are fully editable. Changing the specification keeps weights for matching sieves.</p><div class="fld out" data-zone style="display:none"><span>Zone (IS 383) conforming</span><b data-o="zone"></b></div><canvas class="ch" data-ch="1"></canvas>`,
 onChange(k,d){if(k==='spec'){const pan=d.rows.find(r=>String(r.s).toLowerCase()==='pan');d.rows=[...specRows(d.spec,d.rows),pan||{s:'Pan',w:'',lo:'',hi:''}];return true}},
 calc(d){const o={};const sum=d.rows.reduce((a,r)=>a+(num(r.w)||0),0);const W=num(d.total)>0?num(d.total):sum;o.sum=f(sum,1);
  o.loss=num(d.total)>0&&sum?f((num(d.total)-sum)/num(d.total)*100,2):'';
  let cum=0,pass=true,any=false;const pts=[],lo=[],hi=[],cr={};
  d.rows.forEach((r,i)=>{const p=`rows.${i}.`,w=num(r.w)||0;cum+=w;if(!W){return}const c=cum/W*100;o[p+'cw']=f(cum,1);o[p+'pr']=ok(num(r.w))?f(w/W*100,2):'';o[p+'cr']=f(c,2);const s=num(r.s);if(!ok(s))return;cr[s]=c;const pp=Math.max(0,100-c);o[p+'pp']=f(pp,2);pts.push([s,pp]);const L=num(r.lo),H=num(r.hi);if(ok(L))lo.push([s,L]);if(ok(H))hi.push([s,H]);const b=lim(+pp.toFixed(2),L,H);if(b!==null&&sum>0){o[p+'st']=b?'PASS':'FAIL';any=true;pass&&=b}});
  if(!W){d.rows.forEach((r,i)=>{if(ok(num(r.lo)))lo.push([num(r.s),num(r.lo)]);if(ok(num(r.hi)))hi.push([num(r.s),num(r.hi)])})}
  const STD=[80,40,20,10,4.75,2.36,1.18,0.6,0.3,0.15];let fm=0,nfm=0;STD.forEach(s=>{if(cr[s]!==undefined){fm+=cr[s];nfm++}});o.fm=nfm>=4&&sum?f(fm/100,2):'';
  if(d.spec.startsWith('fa')&&sum){const z=['fa1','fa2','fa3','fa4'].filter(k=>SP[k].s.every(([s,L,H])=>{const q=pts.find(p=>p[0]===s);return!q||(q[1]>=L-1e-9&&q[1]<=H+1e-9)})).map(k=>'Zone '+['I','II','III','IV'][+k[2]-1]);o.zone=z.length?z.join(', '):'None';}
  o.__result=!any?{s:'na',t:'Enter weights retained on each sieve to evaluate gradation.'}:pass?{s:'ok',t:`Gradation CONFORMS to ${SP[d.spec].n}`}:{s:'bad',t:`Gradation DOES NOT CONFORM to ${SP[d.spec].n}`};
  o._g={pts,lo,hi};return o},
 draw(d,o,root){const z=$('[data-zone]',root);if(z)z.style.display=d.spec.startsWith('fa')?'':'none';const cv=$('canvas[data-ch]',root);if(!cv)return;const{pts,lo,hi}=o._g;const xs=[...pts,...lo,...hi].map(p=>p[0]).filter(v=>v>0);const x0=xs.length?Math.min(...xs)/1.6:0.05,x1=xs.length?Math.max(...xs)*1.5:100;const sorted=a=>[...a].sort((p,q)=>p[0]-q[0]);
  chart(cv,{title:'Gradation curve',xlog:1,x0,x1,y0:0,y1:100,xt:[...new Set([...SIEVE_TICKS,...xs])].sort((a,b)=>a-b),xl:'IS Sieve size (mm) – log scale',yl:'% Passing',yf:v=>v.toFixed(0),series:[{pts:sorted(lo),col:'#c0392b',dash:[6,4],w:1.5,label:'Lower limit'},{pts:sorted(hi),col:'#1e7b3a',dash:[6,4],w:1.5,label:'Upper limit'},{pts:sorted(pts),col:'#0b5cad',w:2.4,dot:3.5,label:'Test result'}]})}
})}

reg({id:'proctor',g:'Soil & Earthwork',title:'Compaction (Proctor) – MDD/OMC',rt:'Laboratory Compaction Test – MDD & OMC',std:'IS 2720 (Part 7) : 1980 / IS 2720 (Part 8) : 1983',

  +`<div class="frow res">${O('Maximum Dry Density (MDD)','mdd','g/cc')}${O('Optimum Moisture Content (OMC)','omc','%')}</div><canvas class="ch" data-ch="1"></canvas>`,
 onChange(k,d){if(k==='type'){d.V=d.type==='heavy'?'2250':'1000';return true}},
 calc(d){const o={},V=num(d.V),Wm=num(d.Wm),pts=[];
  d.rows.forEach((r,i)=>{const p=`rows.${i}.`,ws=num(r.wms)-Wm,bd=ws/V,dry=num(r.wd)-num(r.wc),mc=(num(r.ww)-num(r.wd))/dry*100,dd=bd/(1+mc/100);o[p+'ws']=f(ws,1);o[p+'bd']=f(bd,3);o[p+'mc']=f(mc,2);o[p+'dd']=f(dd,3);if(ok(mc)&&ok(dd))pts.push([mc,dd])});
  const pk=peak(pts);d.out=pk;o.mdd=pk?f(pk[1],3):'';o.omc=pk?f(pk[0],2):'';o._pts=pts;o._pk=pk;
  o.__result=pk?{s:'ok',t:`Maximum Dry Density = ${f(pk[1],3)} g/cc   |   Optimum Moisture Content = ${f(pk[0],2)} %`}:{s:'na',t:'Enter at least 3 trials to determine MDD and OMC.'};return o},
 draw(d,o,root){const cv=$('canvas[data-ch]',root),pts=[...o._pts].sort((a,b)=>a[0]-b[0]),pk=o._pk,G=num(d.G);if(!cv)return;

reg({id:'atter',g:'Soil & Earthwork',title:'Atterberg Limits (LL/PL/PI)',rt:'Determination of Liquid Limit, Plastic Limit & Plasticity Index',std:'IS 2720 (Part 5) : 1985',
 init:()=>({llmax:'25',pimax:'6',np:'no',ll:rep(4,()=>({n:'',cn:'',wc:'',ww:'',wd:''})),pl:rep(2,()=>({cn:'',wc:'',ww:'',wd:''}))}),
 blank:l=>l==='ll'?{n:'',cn:'',wc:'',ww:'',wd:''}:{cn:'',wc:'',ww:'',wd:''},
 view:d=>`<div class="frow">${F('Max. permissible LL (%)',N('llmax',d.llmax))}${F('Max. permissible PI (%)',N('pimax',d.pimax))}${F('Plastic limit not obtainable (Non-Plastic)?',SEL('np',d.np,[['no','No'],['yes','Yes – NP']]))}</div><h3>A. Liquid limit (Casagrande)</h3>`
  +T('ll',[{k:'n',h:'No. of<br>blows'},{k:'cn',h:'Container<br>No.',t:'txt'},{k:'wc',h:'Wt. container<br>(g)'},{k:'ww',h:'Cont. + wet<br>soil (g)'},{k:'wd',h:'Cont. + dry<br>soil (g)'},{k:'mc',h:'Moisture<br>content (%)',t:'o'}],d.ll,{sn:'Trial'})
  +`<h3>B. Plastic limit</h3>`+T('pl',[{k:'cn',h:'Container No.',t:'txt'},{k:'wc',h:'Wt. container (g)'},{k:'ww',h:'Cont. + wet soil (g)'},{k:'wd',h:'Cont. + dry soil (g)'},{k:'mc',h:'Moisture content (%)',t:'o'}],d.pl,{sn:'Trial'})
  +`<div class="frow res">${O('Liquid limit LL','LL','%')}${O('Plastic limit PL','PL','%')}${O('Plasticity index PI','PI','%')}${O('Flow index','FI')}</div><canvas class="ch" data-ch="1"></canvas>`,
 calc(d){const o={},mc=r=>(num(r.ww)-num(r.wd))/(num(r.wd)-num(r.wc))*100,pts=[];
  d.ll.forEach((r,i)=>{const m=mc(r);o[`ll.${i}.mc`]=f(m,2);if(ok(m)&&num(r.n)>0)pts.push([num(r.n),m])});
  const pls=d.pl.map((r,i)=>{const m=mc(r);o[`pl.${i}.mc`]=f(m,2);return m});
  let LL=NaN,fi=NaN;if(pts.length>=2){const q=linFit(pts.map(p=>[Math.log10(p[0]),p[1]]));if(q){LL=q[0]*Math.log10(25)+q[1];fi=-q[0]}}else if(pts.length===1){LL=pts[0][1]*(pts[0][0]/25)**0.121}
  const PL=d.np==='yes'?NaN:avg(pls),PI=LL-PL;o.LL=f(LL,1);o.PL=d.np==='yes'?'NP':f(PL,1);o.PI=d.np==='yes'?'NP':f(PI,1);o.FI=f(fi,2);o._pts=pts;o._LL=LL;
  if(!ok(LL))o.__result={s:'na',t:'Enter liquid limit trials (minimum 2 recommended, 15–35 blows).'};else{const bl=lim(LL,null,num(d.llmax)),bp=d.np==='yes'?true:lim(PI,null,num(d.pimax));const good=bl!==false&&bp!==false;o.__result={s:good?'ok':'bad',t:`LL = ${f(LL,1)}%, PL = ${o.PL}${d.np==='yes'?'':'%'}, PI = ${o.PI}${d.np==='yes'?'':'%'} — ${good?'WITHIN':'EXCEEDS'} specified limits (LL ≤ ${d.llmax}%, PI ≤ ${d.pimax}%)`}}return o},
 draw(d,o,root){const cv=$('canvas[data-ch]',root);if(!cv)return;const pts=[...o._pts].sort((a,b)=>a[0]-b[0]);const ys=pts.map(p=>p[1]);const q=pts.length>=2?linFit(pts.map(p=>[Math.log10(p[0]),p[1]])):null;const line=q?[10,15,20,25,30,40,50].map(n=>[n,q[0]*Math.log10(n)+q[1]]):[];const y0=ys.length?Math.floor(Math.min(...ys)-5):0,y1=ys.length?Math.ceil(Math.max(...ys)+5):60;
  chart(cv,{title:'Flow curve',xlog:1,x0:10,x1:60,y0,y1,xt:[10,15,20,25,30,40,50,60],xl:'Number of blows (log scale)',yl:'Moisture content (%)',yf:v=>v.toFixed(0),series:[{pts:line,col:'#0b5cad',w:2,label:'Flow curve'},{pts,col:'#0b5cad',line:false,dot:4}],marks:ok(o._LL)?[{x:25,y:o._LL,t:`LL = ${f(o._LL,1)}%`}]:[]})}
});

reg({id:'cbr',g:'Soil & Earthwork',title:'CBR Test',rt:'California Bearing Ratio (CBR) Test',std:'IS 2720 (Part 16) : 1987',
 init:()=>({unit:'kg',prf:'',cond:'Soaked (4 days)',surch:'5',dd:'',mc:'',req:'',rows:[0,0.5,1,1.5,2,2.5,3,4,5,7.5,10,12.5].map(p=>({pen:String(p),div:''}))}),

 view:d=>`<div class="frow">${F('Load unit',SEL('unit',d.unit,[['kg','kg'],['kN','kN']]))}${F('Proving ring constant (unit/division)',N('prf',d.prf))}${F('Condition',SEL('cond',d.cond,['Soaked (4 days)','Unsoaked']))}${F('Surcharge (kg)',N('surch',d.surch))}${F('Moulded dry density (g/cc)',N('dd',d.dd))}${F('Moulding moisture (%)',N('mc',d.mc))}${F('Minimum CBR required (%)',N('req',d.req))}</div>`
  +T('rows',[{k:'pen',h:'Penetration (mm)'},{k:'div',h:'Proving ring reading (div.)'},{k:'ld',h:'Load',t:'o'}],d.rows,{sn:'S.No'})
  +`<div class="frow res">${O('Load at 2.5 mm','l25')}${O('CBR at 2.5 mm','c25','%')}${O('Load at 5.0 mm','l5')}${O('CBR at 5.0 mm','c5','%')}${O('CBR value adopted','cbr','%')}</div><p class="note">Standard loads: 1370 kg (13.44 kN) at 2.5 mm and 2055 kg (20.16 kN) at 5.0 mm. Higher value adopted; if CBR at 5 mm is consistently higher, adopt it after repeat test.</p><canvas class="ch" data-ch="1"></canvas>`,

  const s25=d.unit==='kN'?13.44:1370,s5=d.unit==='kN'?20.16:2055;const l25=pts.length>1?interp(pts,2.5):NaN,l5=pts.length>1?interp(pts,5):NaN,c25=l25/s25*100,c5=l5/s5*100,cbr=ok(c25)&&ok(c5)?Math.max(c25,c5):c25;

  const b=lim(cbr,num(d.req));o.__result=!ok(cbr)?{s:'na',t:'Enter proving ring constant and readings.'}:{s:b===false?'bad':'ok',t:`CBR (${d.cond}) = ${f(cbr,2)} %`+(b===null?'':b?` — MEETS minimum ${d.req}%`:` — BELOW minimum ${d.req}%`)};return o},
 draw(d,o,root){const cv=$('canvas[data-ch]',root);if(!cv)return;const pts=o._pts,ys=pts.map(p=>p[1]);chart(cv,{title:'Load – penetration curve',x0:0,x1:13,y0:0,y1:ys.length?Math.max(...ys)*1.15||1:100,xt:[0,1,2,2.5,3,4,5,6,7.5,10,12.5],xl:'Penetration (mm)',yl:'Load ('+o._u+')',yf:v=>v>=10?v.toFixed(0):v.toFixed(2),series:[{pts,col:'#0b5cad',smooth:1,dot:3.5,w:2.2,label:'Test'}]})}

reg({id:'cube',g:'Concrete',title:'Cube Compressive Strength',rt:'Compressive Strength of Concrete Cubes',std:'IS 516 (Part 1/Sec 1) : 2021 / IS 456 : 2000',
 init:()=>({fck:'25',size:'150',cast:'',test:today(),age:'',slump:'',reqMean:'',reqMin:'',rows:rep(3,(_,i)=>({id:String(i+1),wt:'',load:''}))}),
 blank:()=>({id:'',wt:'',load:''}),
 view:d=>`<div class="frow">${F('Grade of concrete',SEL('fck',d.fck,GRADES))}${F('Cube size (mm)',SEL('size',d.size,[['150','150 × 150 × 150'],['100','100 × 100 × 100'],['70.6','70.6 (mortar)']]))}${F('Date of casting',I('cast',d.cast,{t:'date'}))}${F('Date of testing',I('test',d.test,{t:'date'}))}${F('Age (days)',N('age',d.age,{ph:'auto from dates'}))}${F('Slump at site (mm)',N('slump',d.slump))}${F('Required avg. strength (N/mm²)',N('reqMean',d.reqMean,{ph:'auto'}))}${F('Min. individual (N/mm²)',N('reqMin',d.reqMin,{ph:'auto'}))}</div>`
  +T('rows',[{k:'id',h:'Cube ID /<br>Mark',t:'txt'},{k:'wt',h:'Weight<br>(kg)'},{k:'den',h:'Density<br>(kg/m³)',t:'o'},{k:'load',h:'Crushing<br>load (kN)'},{k:'str',h:'Compressive<br>strength (N/mm²)',t:'o'},{k:'dev',h:'Deviation<br>from avg (%)',t:'o'},{k:'st',h:'Remarks',t:'o'}],d.rows,{sn:'S.No'})
  +`<div class="frow res">${O('Age of specimen','agec','days')}${O('Average compressive strength','avg','N/mm²')}${O('Required at this age','exp','N/mm²')}${O('% of characteristic strength','pct','%')}${O('Average density','den','kg/m³')}</div><p class="note">Auto requirement: 28 days ≥ fck (mean) and individual ≥ fck − 4 N/mm² (M20 & above) / fck − 3 (below M20) per IS 456 Table 11 — over-type with project criteria if different. Early ages use indicative % of fck (3 d ≈ 40%, 7 d ≈ 65%, 14 d ≈ 90%). Individual results differing by more than ±15% of the average are flagged per IS 516.</p>`,
 calc(d){const o={},fck=num(d.fck),sz=num(d.size),A=sz*sz;let age=num(d.age);if(!ok(age)&&d.cast&&d.test)age=Math.round((new Date(d.test)-new Date(d.cast))/864e5);o.agec=ok(age)?String(age):'';
  const st=d.rows.map(r=>num(r.load)*1000/A),dn=d.rows.map(r=>num(r.wt)/(sz/1000)**3);const a=avg(st),ad=avg(dn);
  const ep=ok(age)?(age>=28?100:interp([[0,0],[3,40],[7,65],[14,90],[28,100]],age)):100;const req=ok(num(d.reqMean))?num(d.reqMean):fck*ep/100;const rmin=ok(num(d.reqMin))?num(d.reqMin):(ok(age)&&age<28?NaN:fck-(fck>=20?4:3));
  let all=true,var15=false;d.rows.forEach((r,i)=>{const p=`rows.${i}.`;o[p+'den']=f(dn[i],0);o[p+'str']=f(st[i],2);const dv=(st[i]-a)/a*100;o[p+'dev']=ok(dv)?(dv>0?'+':'')+f(dv,1):'';if(ok(dv)&&Math.abs(dv)>15)var15=true;const b=lim(st[i],rmin);if(b!==null){o[p+'st']=stat(b);all&&=b}});
  o.avg=f(a,2);o.exp=f(req,2);o.pct=f(a/fck*100,1);o.den=f(ad,0);
  o.__result=!ok(a)?{s:'na',t:'Enter crushing loads.'}:(a>=req-1e-9&&all)?{s:'ok',t:`Average strength ${f(a,2)} N/mm² at ${ok(age)?age+' days':'—'} ≥ required ${f(req,2)} N/mm² — SATISFACTORY for M${fck}${var15?' (note: individual variation > ±15% of average)':''}`}:{s:'bad',t:`Average strength ${f(a,2)} N/mm² — DOES NOT SATISFY requirement (${f(req,2)} N/mm²) for M${fck}${var15?' (individual variation > ±15%)':''}`};return o}
});

reg({id:'ccore',g:'Concrete',title:'Concrete Core Test',rt:'Compressive Strength of Drilled Concrete Cores',std:'IS 516 (Part 4) : 2018 / IS 456 : 2000 cl. 17.4',
 init:()=>({fck:'25',rows:rep(3,(_,i)=>({id:'C'+(i+1),loc:'',dia:'',len:'',load:''}))}),
 blank:()=>({id:'',loc:'',dia:'',len:'',load:''}),
 view:d=>`<div class="frow">${F('Grade of concrete',SEL('fck',d.fck,GRADES))}</div>`+T('rows',[{k:'id',h:'Core<br>ID',t:'txt'},{k:'loc',h:'Location /<br>Member',t:'txt',l:1},{k:'dia',h:'Dia.<br>(mm)'},{k:'len',h:'Length after<br>capping (mm)'},{k:'ld',h:'L/D',t:'o'},{k:'load',h:'Max. load<br>(kN)'},{k:'cs',h:'Core strength<br>(N/mm²)',t:'o'},{k:'cf',h:'L/D correction<br>factor',t:'o'},{k:'cy',h:'Corrected cyl.<br>strength',t:'o'},{k:'eq',h:'Equivalent cube<br>strength (N/mm²)',t:'o'},{k:'st',h:'Remarks',t:'o'}],d.rows,{sn:'S.No'})
  +`<div class="frow res">${O('Average equivalent cube strength','avg','N/mm²')}${O('0.85 fck (avg. criterion)','c85','N/mm²')}${O('0.75 fck (individual criterion)','c75','N/mm²')}</div><p class="note">Correction factor f = 0.11·(L/D) + 0.78 for 1 ≤ L/D ≤ 2 (IS 516 Pt 4). Equivalent cube strength = 1.25 × corrected cylinder strength. Acceptance (IS 456 cl. 17.4.3): average ≥ 0.85 fck and no individual core &lt; 0.75 fck.</p>`,
 calc(d){const o={},fck=num(d.fck),eqs=[];let all=true;

  const a=avg(eqs);o.avg=f(a,2);o.c85=f(0.85*fck,2);o.c75=f(0.75*fck,2);
  o.__result=!ok(a)?{s:'na',t:'Enter core dimensions and loads.'}:(a>=0.85*fck&&all)?{s:'ok',t:`Average equivalent cube strength ${f(a,2)} N/mm² ≥ 0.85 fck and all cores ≥ 0.75 fck — concrete ACCEPTABLE`}:{s:'bad',t:`Average ${f(a,2)} N/mm² — acceptance criteria of IS 456 cl. 17.4.3 NOT MET`};return o}
});

reg({id:'mixc',g:'Concrete',title:'Concrete Mix Design',rt:'Concrete Mix Proportioning',std:'IS 10262 : 2019 / IS 456 : 2000',

 calc(d){const o={},fck=num(d.fck),ag=d.agg,z=+d.zone-1,E=EXPO[d.exp];

function blendMod(id,title,spec,mats,kind){reg({id,g:'Pavement Mix Design',title,rt:title.replace(' (JMF)','')+' – Proportioning of Aggregates'+(kind==='bit'?' / Job Mix Formula':''),std:'MoRTH Specifications for Road & Bridge Works, 5th Revision',
 init:()=>({spec,mats:mats.map((nm,j)=>({nm,p:String(j<mats.length-1?Math.floor(100/mats.length):100-Math.floor(100/mats.length)*(mats.length-1))})),rows:bRows(spec).map(r=>({...r,v:mats.map(()=>'')})),omc:'',mdd:'',nmc:'',evap:'1',obc:'',gmb:''}),
 view:d=>{const n=d.mats.length;return`<div class="frow">${F('Target specification',SEL('spec',d.spec,specOpts()))}</div><h3>A. Material proportions</h3><div class="tw"><table class="tb"><thead><tr><th>Material</th>${d.mats.map((m,j)=>`<th>${I(`mats.${j}.nm`,m.nm)}</th>`).join('')}<th>Total</th></tr></thead><tbody><tr><td><b>Proportion (%)</b></td>${d.mats.map((m,j)=>`<td>${N(`mats.${j}.p`,m.p)}</td>`).join('')}<td class="o" data-o="ptot"></td></tr></tbody></table></div>
  <div class="btns np"><button class="btn" data-act="madd">+ Add material</button><button class="btn" data-act="mdel">− Remove last material</button><button class="btn pri" data-act="opt">⚙ Auto-optimise proportions</button></div>

  <p class="note np">Enter % passing of each material (from its sieve analysis). “Auto-optimise” searches for proportions that keep the blend inside the band and closest to mid-point.</p><canvas class="ch" data-ch="1"></canvas>
  ${kind==='gran'?`<h3>C. Design parameters & plant water</h3><div class="frow">${F('OMC of blend (%)',N('omc',d.omc))}${F('MDD of blend (g/cc)',N('mdd',d.mdd))}${F('Natural moisture of aggregates (%)',N('nmc',d.nmc))}${F('Evaporation allowance (%)',N('evap',d.evap))}${O('Water to add at plant','water','kg/tonne')}</div>`:`<h3>C. Job Mix Formula parameters</h3><div class="frow">${F('Optimum binder content OBC (% by wt. of mix)',N('obc',d.obc))}${F('Marshall bulk density Gmb (g/cc)',N('gmb',d.gmb))}${O('Bitumen per tonne of mix','bit','kg')}${O('Aggregate per tonne of mix','aggt','kg')}</div>`}
  <div data-oh="qty"></div>`},
 onChange(k,d){if(k==='spec'){d.rows=bRows(d.spec,d.rows).map(r=>({...r,v:d.mats.map((_,j)=>r.v?.[j]??'')}));return true}},
 act(a,d){if(a==='madd'){d.mats.push({nm:'Material '+(d.mats.length+1),p:'0'});d.rows.forEach(r=>{r.v=r.v||[];r.v.push('')});return true}
  if(a==='mdel'){if(d.mats.length<=1)return;d.mats.pop();d.rows.forEach(r=>r.v&&r.v.splice(d.mats.length));return true}
  if(a==='opt'){const n=d.mats.length,R=d.rows.filter(r=>ok(num(r.lo))||ok(num(r.hi)));if(!R.length||d.mats.some((m,j)=>!d.rows.some(r=>ok(num(r.v?.[j]))))){toast('Enter % passing for every material first');return}
   const V=R.map(r=>d.mats.map((_,j)=>{const v=num(r.v?.[j]);return ok(v)?v:100})),LO=R.map(r=>ok(num(r.lo))?num(r.lo):0),HI=R.map(r=>ok(num(r.hi))?num(r.hi):100);
   const step=n<=3?1:n===4?2:5,P=new Array(n).fill(0);let best=null,bv=Infinity;
   const ev=()=>{let e=0;for(let i=0;i<R.length;i++){let c=0;for(let j=0;j<n;j++)c+=P[j]*V[i][j]/100;const mid=(LO[i]+HI[i])/2;e+=(c-mid)**2;if(c<LO[i])e+=1e3*(LO[i]-c)**2;if(c>HI[i])e+=1e3*(c-HI[i])**2}return e};
   const rec=(j,rem)=>{if(j===n-1){P[j]=rem;const v=ev();if(v<bv){bv=v;best=P.slice()}return}for(let p=0;p<=rem;p+=step){P[j]=p;rec(j+1,rem-p)}};rec(0,100);

 calc(d){const o={},P=d.mats.map(m=>num(m.p)||0),tot=P.reduce((a,b)=>a+b,0);o.ptot=f(tot,1);d.mats.forEach((m,j)=>o['mh'+j]=m.nm+(P[j]?` (${P[j]}%)`:''));
  let all=true,any=false;const pts=[],lo=[],hi=[];
  d.rows.forEach((r,i)=>{const p=`rows.${i}.`,s=num(r.s);let c=0,has=false;d.mats.forEach((m,j)=>{const v=num(r.v?.[j]);if(ok(v)){has=true;c+=P[j]*v}});c=tot?c/tot:NaN;const L=num(r.lo),H=num(r.hi);o[p+'m']=ok(L)||ok(H)?f(((ok(L)?L:0)+(ok(H)?H:100))/2,1):'';if(ok(L))lo.push([s,L]);if(ok(H))hi.push([s,H]);if(!has)return;o[p+'c']=f(c,1);pts.push([s,c]);const b=lim(+c.toFixed(1),L,H);if(b!==null){o[p+'st']=stat(b);any=true;all&&=b}});

  o._g={pts,lo,hi};
  o.__result=Math.abs(tot-100)>0.01?{s:'bad',t:`Total proportion is ${f(tot,1)}% — must equal 100%`}:!any?{s:'na',t:'Enter gradation of each material.'}:all?{s:'ok',t:`Combined gradation (${d.mats.map((m,j)=>m.nm+' '+P[j]+'%').join(', ')}) CONFORMS to ${SP[d.spec].n}`+(kind==='bit'&&ok(num(d.obc))?` · OBC ${d.obc}%`:'')+(kind==='gran'&&ok(num(d.omc))?` · OMC ${d.omc}%${ok(num(d.mdd))?', MDD '+d.mdd+' g/cc':''}`:'')}:{s:'bad',t:`Combined gradation DOES NOT CONFORM to ${SP[d.spec].n} — adjust proportions`};return o},
 draw:(d,o,root)=>MOD.sv_gsb.draw({spec:'x'},o,root)
})}

/* =================== shell & rendering =================== */
function sigBlock(d){const on=S.sig.map((s,i)=>[s,i]).filter(([s])=>s.on);if(!on.length)return'';return`<div class="sigs">${on.map(([s,i])=>{const signed=d.meta.sign[i]&&s.img;return`<div class="sg"><div class="sgimg" data-act="sign" data-i="${i}" title="Tap to sign / unsign">${signed?`<img src="${s.img}" alt="">`:`<span class="hint">✎ tap to sign</span>`}</div><div class="sgl">${esc(s.label)}</div><div class="sgn">${esc(s.name)}${s.des?`<br>${esc(s.des)}`:''}</div>${signed&&d.meta.signAt[i]?`<div class="sgd">Date: ${fmtDate(d.meta.signAt[i])}</div>`:''}</div>`}).join('')}</div>`}

 return`<div class="sheet" id="report"><div class="rh"><div class="logo">${S.settings.logo?`<img src="${S.settings.logo}" alt="logo">`:''}</div><div class="rht"><div class="lab">${I('@set.lab',S.settings.lab)}</div><h1><textarea data-k="meta.title" class="ta-auto" rows="1">${esc(M.title)}</textarea></h1><div class="std">${I('meta.std',M.std)}</div></div>
 <div class="rno"><b>Report No.</b>${I('meta.no',M.no,{ph:'e.g. QC/'+m.id.toUpperCase()+'/001'})}<b>Date of test</b>${I('meta.date',M.date,{t:'date'})}</div></div>

  <div class="pf"><span>Contractor</span>${I('@p.contractor',P.contractor)}</div><div class="pf"><span>Agreement / Pkg No.</span>${I('@p.agreement',P.agreement)}</div>
  <div class="pf"><span>Sample ID / Lab ref.</span>${I('meta.sample',M.sample)}</div><div class="pf"><span>Source / Supplier</span>${I('meta.source',M.source)}</div>

  <div class="pf"><span>Date of sampling</span>${I('meta.samp',M.samp,{t:'date'})}</div><div class="pf"><span>Qty. represented</span>${I('meta.qty',M.qty)}</div>
 </div>

const main=$('#main'),nav=$('#nav');
let lastRes=null,lastO={};
function render(){const m=MOD[cur];if(!m)return;if(cur!=='scanner')stopCam();if(m.custom){m.render(main);lastRes=null;return}const d=D();main.innerHTML=shell(m,d);$$('.ta-auto',main).forEach(autoGrow);run()}
function run(){const m=MOD[cur];if(!m||m.custom)return;const d=D();let o={};try{o=m.calc?m.calc(d)||{}:{}}catch(e){console.error(e)}lastO=o;
 $$('[data-o]',main).forEach(el=>{const k=el.dataset.o;let v=o[k];if(k==='__result'){lastRes=v||null;el.className='result '+(v?v.s:'na');el.textContent=v?v.t:'';return}v=v==null?'':String(v);el.textContent=v;el.classList.toggle('pass',v==='PASS');el.classList.toggle('fail',v==='FAIL')});
 $$('[data-oh]',main).forEach(el=>el.innerHTML=o[el.dataset.oh]||'');

main.addEventListener('input',e=>{if(e.target.classList.contains('ta-auto'))autoGrow(e.target);const k=e.target.dataset.k;if(!k)return;const[o,p]=bind(k);sp(o,p,e.target.value);save();run()});
main.addEventListener('change',e=>{const k=e.target.dataset.k;if(!k)return;const m=MOD[cur];const[o,p]=bind(k);sp(o,p,e.target.value);save();if(m.onChange&&m.onChange(k,D()))render();else run()});
main.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,m=MOD[cur];
 if(a==='add'||a==='del'){const d=D(),l=b.dataset.l,arr=gp(d,l);if(a==='add')arr.push(m.blank?m.blank(l,d):{});else arr.splice(+b.dataset.i,1);save();render();return}
 if(a==='sign'){signDialog(+b.dataset.i);return}
 if(m.act){const r=await m.act(a,m.custom?null:D(),b);if(r){save();render()}}});
function signDialog(i){const s=S.sig[i],d=D();if(!s.img){modal(`<h3>Signature for “${esc(s.label)}”</h3><p class="sub" style="color:var(--mut)">Draw the signature below. It will be saved for future reports.</p><canvas class="padc" id="mpad"></canvas><label class="fld" style="margin-top:8px"><span>Name</span><input id="mname" value="${esc(s.name)}" style="width:100%;padding:6px;border:1px solid var(--line);border-radius:5px;background:var(--bg);color:var(--ink)"></label><div class="btns" style="margin-top:10px"><button class="btn pri" id="msave">Save & sign</button><button class="btn" id="mclr">Clear</button><button class="btn" onclick="closeModal()">Cancel</button></div>`);
  const pad=attachPad($('#mpad'));$('#mclr').onclick=()=>pad.clear();$('#msave').onclick=()=>{const png=pad.png();if(!png){toast('Draw a signature first');return}s.img=png;s.name=$('#mname').value;d.meta.sign[i]=true;d.meta.signAt[i]=today();save();closeModal();render()};return}
 const signed=!!d.meta.sign[i];modal(`<h3>${esc(s.label)}${s.name?' – '+esc(s.name):''}</h3><div style="background:#fff;border-radius:6px;padding:8px;text-align:center"><img src="${s.img}" style="max-height:90px;max-width:100%"></div><div class="btns" style="margin-top:12px">${signed?'<button class="btn" id="munsign">Remove signature from this report</button>':'<button class="btn pri" id="msign">Sign this report</button>'}<button class="btn" id="mredraw">Redraw signature</button><button class="btn" onclick="closeModal()">Cancel</button></div>`);
 $('#msign')&&($('#msign').onclick=()=>{d.meta.sign[i]=true;d.meta.signAt[i]=today();save();closeModal();render();toast('Report signed')});
 $('#munsign')&&($('#munsign').onclick=()=>{delete d.meta.sign[i];delete d.meta.signAt[i];save();closeModal();render()});

function fileName(){const m=MOD[cur];if(m.custom)return`Scanned-documents-${today()}.pdf`;const d=D();return(`${d.meta.title||m.title}_${d.meta.no||''}_${d.meta.date||today()}`).replace(/[^\w\-]+/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'')+'.pdf'}
async function buildPdf(){if(!window.jspdf||!window.html2canvas){toast('PDF library not loaded — check internet connection once');return null}const{jsPDF}=window.jspdf;const m=MOD[cur];
 if(m.custom){if(cur!=='scanner'){toast('Open a test tab to create its PDF');return null}if(!SCAN.length){toast('No scanned pages');return null}return scanPdf(null,'')}
 const src=$('#report');const clone=src.cloneNode(true);clone.removeAttribute('id');
 const oi=$$('input,select,textarea',src),ci=$$('input,select,textarea',clone);ci.forEach((el,i)=>{const o=oi[i];let v=o.tagName==='SELECT'?(o.options[o.selectedIndex]?.text||''):o.value;if(o.type==='date')v=fmtDate(v);const s=document.createElement('div');s.className='pv';s.textContent=v;el.replaceWith(s)});
 const oc=$$('canvas',src),cc=$$('canvas',clone);cc.forEach((c,i)=>{const im=document.createElement('img');im.className='chimg';im.src=oc[i].toDataURL('image/png');c.replaceWith(im)});
 $$('.np',clone).forEach(e=>e.remove());clone.classList.add('pdf');const host=document.createElement('div');host.className='pdfhost';host.appendChild(clone);document.body.appendChild(host);
 await Promise.all($$('img',clone).map(im=>im.complete?0:new Promise(r=>{im.onload=im.onerror=r})));
 const scale=2;let cv;try{cv=await html2canvas(clone,{scale,backgroundColor:'#ffffff',useCORS:true,logging:false,windowWidth:900})}catch(e){host.remove();throw e}
 const top=clone.getBoundingClientRect().top;const br=$$('tr,.blk,.result,.rem,.sigs,.pgrid,.rh,img.chimg,.frow,h3,.note,.tw',clone).map(e=>(e.getBoundingClientRect().bottom-top)*scale).sort((a,b)=>a-b);host.remove();
 const pdf=new jsPDF({unit:'mm',format:'a4',compress:true}),mg=8,pw=210-2*mg,ph=297-2*mg-6,pxmm=cv.width/pw,pageH=ph*pxmm;let y=0,pg=0;
 while(y<cv.height-4){let end=Math.min(y+pageH,cv.height);if(end<cv.height){const c=br.filter(b=>b>y+pageH*0.35&&b<=end+0.5);if(c.length)end=c[c.length-1]}const h=Math.ceil(end-y);const pc=document.createElement('canvas');pc.width=cv.width;pc.height=h;const g=pc.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,pc.width,h);g.drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);if(pg)pdf.addPage();pdf.addImage(pc.toDataURL('image/jpeg',0.92),'JPEG',mg,mg,pw,h/pxmm);pg++;y=end}
 if(S.settings.annex&&SCAN.length)scanPdf(pdf,'Annexure – Scanned document');
 const n=pdf.getNumberOfPages(),d=D();for(let i=1;i<=n;i++){pdf.setPage(i);pdf.setFontSize(7.5);pdf.setTextColor(110);pdf.text(`${d.meta.title||m.title}${d.meta.no?'  ·  Report No. '+d.meta.no:''}`,mg,297-6);pdf.text(`Page ${i} of ${n}`,210-mg,297-6,{align:'right'})}
 return pdf}
async function withBusy(fn){$('#busy').classList.add('on');try{return await fn()}catch(e){console.error(e);toast('Could not create PDF: '+(e.message||e))}finally{$('#busy').classList.remove('on')}}
async function doPdf(){const pdf=await withBusy(buildPdf);if(pdf){download(pdf.output('blob'),fileName());toast('PDF downloaded')}}
function summary(){const m=MOD[cur];if(m.custom)return'Scanned documents';const d=D(),P=S.project;return[`*${d.meta.title||m.title}*`,P.name&&`Project: ${P.name}`,d.meta.no&&`Report No: ${d.meta.no}`,`Date: ${fmtDate(d.meta.date)}`,d.meta.loc&&`Location: ${d.meta.loc}`,lastRes&&lastRes.s!=='na'&&`Result: ${lastRes.t}`].filter(Boolean).join('\n')}
async function doShare(){const pdf=await withBusy(buildPdf);if(!pdf)return;const blob=pdf.output('blob'),name=fileName(),text=summary();if(NATIVE){try{await nativeShare(blob,name,text)}catch(e){if(!/cancel/i.test(e.message||''))toast('Share failed: '+(e.message||e))}return}const file=new File([blob],name,{type:'application/pdf'});
 if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name,text});return}catch(e){if(e.name==='AbortError')return}}
 const enc=encodeURIComponent(text);modal(`<h3>Share report</h3><p style="color:var(--mut);margin-top:0">Your browser can’t attach files directly. Download the PDF, then attach it in the app you choose.</p><div class="btns"><button class="btn pri" id="shdl">⬇ Download PDF</button><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${enc}">WhatsApp</a><a class="btn" href="mailto:?subject=${encodeURIComponent(name)}&body=${enc}">Email</a><a class="btn" target="_blank" rel="noopener" href="https://t.me/share/url?url=%20&text=${enc}">Telegram</a><button class="btn" id="shcp">Copy summary</button><button class="btn" onclick="closeModal()">Close</button></div><pre style="white-space:pre-wrap;background:var(--bg);padding:10px;border-radius:6px;font-size:12px">${esc(text)}</pre>`);
 $('#shdl').onclick=()=>download(blob,name);$('#shcp').onclick=()=>{navigator.clipboard?.writeText(text).then(()=>toast('Copied'),()=>toast('Copy failed'))}}
function saveRec(){const m=MOD[cur];if(m.custom){toast('Open a test tab to save its report');return}const d=D();const id=d._rid||('r'+Date.now());d._rid=id;const rec={id,tab:cur,no:d.meta.no,date:d.meta.date,loc:[d.meta.loc,d.meta.sample].filter(Boolean).join(' / '),res:lastRes&&lastRes.s!=='na'?lastRes.t:'',at:new Date().toISOString(),data:deep(d)};const i=S.records.findIndex(r=>r.id===id);if(i>=0)S.records[i]=rec;else S.records.unshift(rec);saveNow();toast(i>=0?'Record updated':'Saved to Records')}
$('#bPdf').onclick=doPdf;$('#bShare').onclick=doShare;$('#bSave').onclick=saveRec;$('#bPrint').onclick=()=>window.print();
